[package]
name = "agentlight"
description = "Always-on-top desktop widget for clawlight session state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "agentlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
agentlight-core = { path = "../crates/agentlight-core" }
agentlight-server = { path = "../crates/agentlight-server" }
serde = { workspace = true }
serde_json = { workspace = true }
