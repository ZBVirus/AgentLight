[workspace]
resolver = "2"
members = ["crates/agentlight-core", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZBVirus/AgentLight"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
fs4 = { version = "0.13", features = ["sync"] }
dirs = "6"
notify = "8"
tempfile = "3"
