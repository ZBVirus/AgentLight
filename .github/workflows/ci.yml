name: ci

on:
  # Runs on pull requests into any branch, so stacked PRs get CI, and on demand.
  # Branch pushes never trigger it: test locally, then open a PR (or use
  # workflow_dispatch) when you want CI.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p agentlight-core -p agentlight-server -p agentlight-hub-client -p agentlight-source-events --all-targets -- -D warnings
      - name: Test
        run: cargo test -p agentlight-core -p agentlight-server -p agentlight-hub-client -p agentlight-source-events

  plugin:
    name: plugin (node tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test plugin
        run: node --test tests/plugin/

  # Frontend behaviour in jsdom: no browser, so it runs anywhere Node does.
  frontend:
    name: frontend (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: tests/frontend
        run: npm install --include=dev --no-audit --no-fund
      - name: Test
        working-directory: tests/frontend
        run: node --test

  # Real browser: the frontend against a mocked __TAURI__, and the hub web client
  # against a spawned agentlight-server.
  playwright:
    name: playwright (frontend + web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server
        run: cargo build -p agentlight-server
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: tests/playwright
        run: npm install --include=dev --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests/playwright
        run: npx playwright install --with-deps chromium
      - name: Test
        working-directory: tests/playwright
        run: npx playwright test

  # Real app UI over WebView2 remote debugging. The build gets a test-only
  # additionalBrowserArgs so Playwright can drive the window; the shipped
  # windows-app artifact is unaffected.
  windows-gui:
    name: windows gui (cdp e2e)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable WebView2 remote debugging (test build)
        shell: pwsh
        run: node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.app.windows[0].additionalBrowserArgs='--remote-debugging-port=9222 --remote-allow-origins=*';fs.writeFileSync(p,JSON.stringify(j,null,2));"

      - name: Build app
        run: cargo build -p agentlight --profile ci

      - name: Install test deps
        working-directory: tests/windows
        run: npm install --include=dev --no-audit --no-fund

      - name: Run CDP e2e
        working-directory: tests/windows
        shell: pwsh
        run: ./run-cdp.ps1 -Exe ../../target/ci/agentlight.exe

  # The app and the server build in parallel. They share one cargo cache so the
  # second warm run reuses the common dependencies. Artifacts use the fast `ci`
  # profile; the release workflow builds the optimized binaries.
  windows-app:
    name: windows app (portable exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo

      - name: Build app
        run: cargo build -p agentlight --profile ci

      - name: Stage portable exe
        shell: pwsh
        run: Copy-Item target/ci/agentlight.exe target/ci/AgentLight-portable.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: agentlight-windows-portable
          if-no-files-found: warn
          path: target/ci/AgentLight-portable.exe
          retention-days: 7

  windows-server:
    name: windows server exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo

      - name: Build server
        run: cargo build -p agentlight-server --profile ci

      - name: Upload server exe
        uses: actions/upload-artifact@v4
        with:
          name: agentlight-server-windows
          if-no-files-found: warn
          path: target/ci/agentlight-server.exe
          retention-days: 7
