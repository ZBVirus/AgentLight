name: ci

on:
  # Runs on pull requests into any branch, so stacked PRs get CI, and on demand.
  # Branch pushes never trigger it: test locally, then open a PR (or use
  # workflow_dispatch) when you want CI.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p agentlight-core -p agentlight-server -p agentlight-hub-client --all-targets -- -D warnings
      - name: Test
        run: cargo test -p agentlight-core -p agentlight-server -p agentlight-hub-client

  plugin:
    name: plugin (node tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test plugin
        run: node --test plugins/opencode/test/agentlight.test.js

  # The app and the server build in parallel. They share one cargo cache so the
  # second warm run reuses the common dependencies. Artifacts use the fast `ci`
  # profile; the release workflow builds the optimized binaries.
  windows-app:
    name: windows app (portable exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo

      - name: Build app
        run: cargo build -p agentlight --profile ci

      - name: Stage portable exe
        shell: pwsh
        run: Copy-Item target/ci/agentlight.exe target/ci/AgentLight-portable.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: agentlight-windows-portable
          if-no-files-found: warn
          path: target/ci/AgentLight-portable.exe
          retention-days: 7

  windows-server:
    name: windows server exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo

      - name: Build server
        run: cargo build -p agentlight-server --profile ci

      - name: Upload server exe
        uses: actions/upload-artifact@v4
        with:
          name: agentlight-server-windows
          if-no-files-found: warn
          path: target/ci/agentlight-server.exe
          retention-days: 7
