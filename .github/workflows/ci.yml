name: ci

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p agentlight-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p agentlight-core

  windows:
    name: windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p agentlight-core

      # Compile-check the Tauri app. The NSIS installer is produced by the
      # release workflow, which installs the (slow to compile) tauri-cli.
      - name: Build app
        run: cargo build -p agentlight --release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: agentlight-windows-exe
          if-no-files-found: warn
          path: target/release/agentlight.exe
