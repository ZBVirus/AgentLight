name: dev-build

# On-demand portable build for testing, without waiting for a push. Uses the
# fast `ci` profile. Pick the branch/ref when you run it.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-dev:
    name: windows dev portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo

      - name: Build app (fast profile)
        run: cargo build -p agentlight --profile ci

      - name: Stage portable exe
        shell: pwsh
        run: Copy-Item target/ci/agentlight.exe target/ci/AgentLight-dev.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: agentlight-windows-dev
          path: target/ci/AgentLight-dev.exe
          if-no-files-found: error
